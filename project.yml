# Generates LocalLab.xcodeproj:  xcodegen generate
#
# The app target is a thin shell (App/) around the LocalLabUI library in this same package, so
# `swift build`/`swift test` and the Xcode app compile identical code.
#
# One sandboxed, hardened build for both the Mac App Store and direct download (plan §9.4).
name: LocalLab
options:
  bundleIdPrefix: io.github.jboone100
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  LocalLab:
    path: .
targets:
  LocalLab:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: LocalLab
        product: LocalLabUI
    settings:
      base:
        # Registered 2026-09-18 under the owner's individual account; the App Store record is
        # "LocalLab AI" (plain "LocalLab" was taken). The app itself is still called LocalLab.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jboone100.locallab
        DEVELOPMENT_TEAM: K8CKJEN3KC
        PRODUCT_NAME: LocalLab
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: LocalLab
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # Sandboxed and hardened in every configuration, so a debug run behaves like the one
        # users get (plan §9.4). Entitlements: App/LocalLab.entitlements.
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: App/LocalLab.entitlements
